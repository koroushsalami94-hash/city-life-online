<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>City Life Online — Losantos Prototype</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9ec7df;font-family:system-ui,sans-serif}
  #info{position:fixed;top:10px;right:10px;z-index:2;color:#fff;background:#142333cc;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.7}
  #controls{position:fixed;bottom:18px;left:18px;z-index:2;display:grid;grid-template-columns:54px 54px 54px;gap:6px;direction:ltr}
  button{border:0;border-radius:14px;background:#142333cc;color:white;font-size:22px;width:54px;height:50px;touch-action:none}
  #up{grid-column:2} #left{grid-column:1;grid-row:2} #down{grid-column:2;grid-row:2} #right{grid-column:3;grid-row:2}
  #hint{position:fixed;bottom:12px;right:12px;z-index:2;background:#fffE;color:#142333;padding:8px 10px;border-radius:10px;font-size:12px}
  canvas{display:block}
</style>
</head>
<body>
<div id="info"><b>City Life Online</b><br>Losantos — نمونهٔ اولیه<br>با دکمه‌ها یا کلیدهای جهت حرکت کن</div>
<div id="controls">
  <button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
</div>
<div id="hint">نسخهٔ آزمایشی؛ هنوز بازی کامل نیست</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec7df);
scene.fog = new THREE.Fog(0x9ec7df, 55, 155);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x617080, 2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(-25, 45, 25); scene.add(sun);

const mat = (color)=>new THREE.MeshStandardMaterial({color, roughness:0.9});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220,220), mat(0x6e9a68));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.08; scene.add(ground);

// Main road and sidewalks
const road = new THREE.Mesh(new THREE.PlaneGeometry(18,190), mat(0x30363d));
road.rotation.x=-Math.PI/2; road.position.set(0,0,0); scene.add(road);
for (const x of [-10,10]) {
  const walk = new THREE.Mesh(new THREE.PlaneGeometry(2,190), mat(0xb9b6a8));
  walk.rotation.x=-Math.PI/2; walk.position.set(x,0.01,0); scene.add(walk);
}
const dashMat=mat(0xf4e5a8);
for(let z=-88;z<95;z+=10){
  const dash=new THREE.Mesh(new THREE.BoxGeometry(.22,.035,4),dashMat);
  dash.position.set(0,.035,z); scene.add(dash);
}

// Buildings on both sides, with simple windows
const buildingMats=[0xb9a38b,0x8799a7,0xc2c5c2,0x9b8caa,0xd0b68c].map(mat);
for(let side of [-1,1]){
  for(let i=0;i<12;i++){
    const w=7+Math.random()*5, h=7+Math.random()*20, d=7+Math.random()*7;
    const x=side*(17+Math.random()*7), z=-82+i*15;
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),buildingMats[i%buildingMats.length]);
    b.position.set(x,h/2,z); scene.add(b);
    const winMat=mat(0x8bc5d8);
    for(let yy=2.3;yy<h-1;yy+=3){
      for(let xx=-w/2+1.2;xx<w/2-0.5;xx+=2.1){
        const win=new THREE.Mesh(new THREE.BoxGeometry(.95,1.25,.08),winMat);
        win.position.set(x+xx,yy,z-d/2-.05); scene.add(win);
      }
    }
  }
}
// Trees and street lamps
for(let side of [-1,1]){
  for(let i=0;i<14;i++){
    const x=side*13.5,z=-90+i*13;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,2.2,7),mat(0x72503a));
    trunk.position.set(x,1.1,z);scene.add(trunk);
    const crown=new THREE.Mesh(new THREE.SphereGeometry(1.35,8,7),mat(0x39764b));
    crown.position.set(x,3,z);scene.add(crown);
  }
}

// Player: simple stylized character
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,4,8),mat(0x245caa));
body.position.y=1.05; player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),mat(0xd6a77c));
head.position.y=1.85; player.add(head);
player.position.set(0,0,18); scene.add(player);

const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const bind=(id,key)=>{
 const el=document.getElementById(id);
 const on=e=>{e.preventDefault();keys[key]=true};
 const off=e=>{e.preventDefault();keys[key]=false};
 el.addEventListener('pointerdown',on);
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,off));
};
bind('up','arrowup');bind('down','arrowdown');bind('left','arrowleft');bind('right','arrowright');

camera.position.set(0,6,27);
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 let dx=0,dz=0;
 if(keys['arrowleft']||keys['a'])dx-=1;
 if(keys['arrowright']||keys['d'])dx+=1;
 if(keys['arrowup']||keys['w'])dz-=1;
 if(keys['arrowdown']||keys['s'])dz+=1;
 const len=Math.hypot(dx,dz)||1;
 player.position.x=THREE.MathUtils.clamp(player.position.x+dx/len*7*dt,-7,7);
 player.position.z=THREE.MathUtils.clamp(player.position.z+dz/len*7*dt,-88,88);
 if(dx||dz) player.rotation.y=Math.atan2(dx,dz);
 const target=new THREE.Vector3(player.position.x,player.position.y+3.5,player.position.z+8);
 camera.position.lerp(target,.08);
 camera.lookAt(player.position.x,1.2,player.position.z-3);
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
